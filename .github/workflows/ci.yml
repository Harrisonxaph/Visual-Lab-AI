name: Phase 1 checks
on:
  pull_request:
  push:
    branches: ["phase-1/live-object-detection"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
